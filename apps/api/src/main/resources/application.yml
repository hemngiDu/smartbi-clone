spring:
  application:
    name: smartbi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartbi}
    username: ${SPRING_DATASOURCE_USERNAME:smartbi}
    password: ${SPRING_DATASOURCE_PASSWORD:smartbi_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  error:
    include-message: never
smartbi:
  credentials:
    allowed-environment-variables: ${SMARTBI_ALLOWED_CREDENTIALS:}
  security:
    api-keys:
      ci: ${SMARTBI_API_KEY:}
    roles:
      ci: ADMIN
  network:
    allowed-hosts: ${SMARTBI_ALLOWED_DB_HOSTS:}
    allowed-ports: ${SMARTBI_ALLOWED_DB_PORTS:5432}
  query:
    timeout-seconds: ${SMARTBI_QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${SMARTBI_QUERY_MAX_ROWS:500}
    max-page-size: ${SMARTBI_QUERY_MAX_PAGE_SIZE:200}
  pools:
    maximum-pool-size: ${SMARTBI_POOL_MAX_SIZE:5}
    connection-timeout-ms: ${SMARTBI_POOL_CONNECTION_TIMEOUT_MS:5000}

