services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartbi}
      POSTGRES_USER: ${POSTGRES_USER:-smartbi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_admin
      POSTGRES_PASSWORD: compose_admin_only
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_admin -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartbi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartbi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartbi_dev_password}
      EXTERNAL_ANALYTICS_PASSWORD: ${EXTERNAL_ANALYTICS_PASSWORD:-compose_reader_only}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:

